name: Deploy to AWS Lambda (ECR)

on:
  push:
    branches:
      - main
    paths:
      - 'starter_apps/budgetbot/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: budgetbot-backend
          IMAGE_TAG: latest
        run: |
          cd starter_apps/budgetbot
          docker build --provenance=false --sbom=false --platform linux/amd64 -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update AWS Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name budgetbot-main-image-lambda \
            --image-uri 640056739375.dkr.ecr.us-west-2.amazonaws.com/budgetbot-backend:latest \
            --region us-west-2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend (React + Vite)
        env:
          VITE_API_BASE_URL: https://nkpmczaztg.execute-api.us-west-2.amazonaws.com/api
        run: |
          cd starter_apps/budgetbot/frontend
          npm ci
          npm run build

      - name: Deploy Frontend to S3
        run: |
          aws s3 sync starter_apps/budgetbot/frontend/dist/ s3://w7-frontend-hackathon/ \
            --region us-west-2 \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp starter_apps/budgetbot/frontend/dist/index.html s3://w7-frontend-hackathon/index.html \
            --region us-west-2 \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id E537PWDECR5IZ --paths "/*"
